name: Jagoncito cada 4 horas

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Turno UTC opcional: YYYY-MM-DDTHH:00:00Z (00/04/08/12/16/20)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jagoncito-production
  cancel-in-progress: false

jobs:
  crear-y-subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Descargar código sin medios LFS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automatizacion/produccion/requirements.txt
      - name: Recuperar instrumentos verificados
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/jagoncito-piano
          key: piano-cc0-${{ hashFiles('automatizacion/produccion/instrumento-vsco-fuentes.json') }}
      - name: Instalar herramientas y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg git-lfs
          git lfs install --local
          python -m pip install --requirement automatizacion/produccion/requirements.txt
      - name: Comprobar el programador
        run: |
          python -m unittest discover -s automatizacion/tests -v
          python -m unittest discover -s automatizacion/produccion -p 'test*.py' -v
      - name: Producir, verificar y publicar
        env:
          REQUESTED_SLOT: ${{ inputs.slot }}
        run: |
          args=(--cache "$RUNNER_TEMP/jagoncito-piano")
          if [ -n "$REQUESTED_SLOT" ]; then
            args+=(--slot "$REQUESTED_SLOT")
          fi
          python automatizacion/ejecutar.py "${args[@]}"
