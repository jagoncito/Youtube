name: Verificar repositorio sin producir vídeos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'automatizacion/**'
      - '.gitattributes'
      - 'videos/*/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automatizacion/produccion/requirements.txt
      - name: Preparar comprobaciones
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg git-lfs
          python -m pip install -r automatizacion/produccion/requirements.txt
      - name: Probar publicación directa y originalidad
        run: |
          python -m unittest discover -s automatizacion/tests -v
          python -m unittest discover -s automatizacion/produccion -p 'test*.py' -v
      - name: Validar carpetas e integridad de punteros
        run: python automatizacion/verificar_repositorio.py
